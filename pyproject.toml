[project]
name = "mlops-sentiment-api"
version = "0.1.0"
description = "API de IA/ML en contenedor para clasificar sentimiento de textos."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "prometheus-client==0.21.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[project.scripts]
mlops-sentiment-api = "app.main:run"
train-sentiment-model = "scripts.train_model:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
